    <!-- TOP PROMO BANNER -->
    <div class="ts-top-banner" id="ts-promo-banner">
      <div class="ts-banner-inner">
        <span class="ts-banner-emoji">🎉</span>
        <span>Launch Special — Use code</span>
        <span class="ts-banner-code">LAUNCH30</span>
        <span>for 30% off</span>
        <span class="ts-banner-sep">·</span>
        <span>7-day free trial</span>
      </div>
    </div>

    <div id="root"></div>

    <!-- FIREBASE SSO IMPLEMENTATION -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBCDXKN9_Aco_OyGniee9EnloE71ROCV0s",
        authDomain: "tradescribes.firebaseapp.com",
        projectId: "tradescribes",
        storageBucket: "tradescribes.firebasestorage.app",
        messagingSenderId: "65617962237",
        appId: "1:65617962237:web:f207bb4c9ef30922d7ca94"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      function handleGoogleSignIn(e) {
        e.preventDefault();
        e.stopPropagation();
        
        signInWithPopup(auth, provider)
          .then((result) => {
            const user = result.user;
            console.log("Successfully signed in: ", user.email);
            
            // Redirect the user to Stripe Checkout with the LAUNCH30 coupon automatically applied!
            window.location.href = "https://buy.stripe.com/bJe9ATahdfLYauqfJ68N200?prefilled_promo_code=LAUNCH30";
            
          })
          .catch((error) => {
            console.error("Error signing in: ", error);
            alert("Error: " + error.message);
          });
      }

      // --- NEW: Observe the DOM to inject Google button into the "Sign in" modal ---
      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          if (mutation.addedNodes.length) {
            // Look for the email input and the "Sign in" button
            const emailInput = document.querySelector('input[type="email"], input[name="email"]');
            const submitBtn = Array.from(document.querySelectorAll('button')).find(
              btn => (btn.textContent || '').trim().toLowerCase() === 'sign in'
            );
            
            // If the modal is present and we haven't already injected the Google button
            if (emailInput && submitBtn && !document.getElementById('ts-modal-google-btn')) {
              
              const ssoContainer = document.createElement('div');
              ssoContainer.id = 'ts-modal-google-btn';
              ssoContainer.style.width = '100%';
              ssoContainer.style.marginBottom = '20px';
              
              // Create the new Google button
              const googleBtn = document.createElement('button');
              googleBtn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;gap:12px;"><svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>Sign in with Google</span>';
              
              // Style the button to be GREEN
              googleBtn.style.backgroundColor = '#22C55E';
              googleBtn.style.color = '#000000';
              googleBtn.style.border = 'none';
              googleBtn.style.width = '100%';
              googleBtn.style.padding = '12px';
              googleBtn.style.borderRadius = '8px';
              googleBtn.style.cursor = 'pointer';
              googleBtn.style.fontWeight = '700';
              googleBtn.style.fontSize = '16px';
              googleBtn.style.fontFamily = 'Inter, sans-serif';
              googleBtn.style.transition = 'background-color 0.2s, transform 0.2s';
              googleBtn.onmouseover = () => { googleBtn.style.backgroundColor = '#16a34a'; googleBtn.style.transform = 'scale(1.02)'; };
              googleBtn.onmouseout = () => { googleBtn.style.backgroundColor = '#22C55E'; googleBtn.style.transform = 'scale(1)'; };
              
              // Trigger the Google Sign in!
              googleBtn.addEventListener('click', handleGoogleSignIn);
              
              // Create the "OR" divider
              const divider = document.createElement('div');
              divider.innerHTML = '<span style="background:#111; padding:0 10px; color:#9CA3AF; font-size:12px;">OR</span>';
              divider.style.display = 'flex';
              divider.style.alignItems = 'center';
              divider.style.justifyContent = 'center';
              divider.style.textAlign = 'center';
              divider.style.marginTop = '20px';
              divider.style.marginBottom = '8px';
              divider.style.position = 'relative';
              divider.style.fontFamily = 'Inter, sans-serif';
              
              // Add a line behind the OR text
              const line = document.createElement('div');
              line.style.position = 'absolute';
              line.style.top = '50%';
              line.style.left = '0';
              line.style.right = '0';
              line.style.height = '1px';
              line.style.backgroundColor = '#333';
              line.style.zIndex = '-1';
              divider.appendChild(line);
              
              ssoContainer.appendChild(googleBtn);
              ssoContainer.appendChild(divider);
              
              // Insert the Google button and divider ABOVE the email input container
              // We find the parent container of the email input to insert before it
              const label = document.querySelector('label');
              const targetElement = label && label.textContent.includes('EMAIL') ? label : emailInput;
              
              targetElement.parentNode.insertBefore(ssoContainer, targetElement);
            }
          }
        }
      });

      // Start observing the whole document for when the modal pops up
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
