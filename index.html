    <style>
      .ts-top-banner {
        width: 100%;
        background-color: #22C55E;
        color: #000000;
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        padding: 12px 20px;
        letter-spacing: 0.2px;
        position: relative;
        z-index: 99999;
        box-shadow: 0 2px 12px rgba(34, 197, 94, 0.3);
        animation: ts-banner-slideDown 0.5s ease-out;
      }
      @keyframes ts-banner-slideDown {
        from { transform: translateY(-100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .ts-top-banner .ts-banner-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .ts-top-banner .ts-banner-emoji { font-size: 18px; }
      .ts-top-banner .ts-banner-code {
        display: inline-block;
        background: rgba(0, 0, 0, 0.15);
        color: #000000;
        font-family: 'Inter', monospace;
        font-weight: 800;
        letter-spacing: 1.5px;
        padding: 2px 10px;
        border-radius: 5px;
        font-size: 15px;
      }
      .ts-top-banner .ts-banner-sep { opacity: 0.5; margin: 0 4px; }
      @media (max-width: 640px) {
        .ts-top-banner { font-size: 13px; padding: 10px 14px; }
        .ts-top-banner .ts-banner-code { font-size: 13px; }
      }
    </style>
