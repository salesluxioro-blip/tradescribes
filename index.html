        '⚡ Brandon from New York, NY 🇺🇸 just generated his first invoice',
        '🔨 Connor from Glasgow, UK 🇬🇧 just started his free trial',
        '🪠 Scott from Surrey, BC 🇨🇦 just sent his first invoice',
        '🔧 Jake from Phoenix, AZ 🇺🇸 just signed up',
        '⚡ Callum from Bristol, UK 🇬🇧 just generated an invoice'
      ];

      var toastInitialized = false;
      var currentToastIndex = 0;
      var toastEl = null;

      function initToastSystem() {
        if (toastInitialized) return;
        toastInitialized = true;

        toastEl = document.createElement('div');
        toastEl.className = 'ts-toast';
        document.body.appendChild(toastEl);

        function showNextToast() {
          var text = toasts[currentToastIndex];
          toastEl.innerHTML = '<div class="ts-toast-text">' + text + '</div><div class="ts-toast-sub">2 min ago</div>';
          
          toastEl.classList.add('show');

          setTimeout(function() {
            toastEl.classList.remove('show');
          }, 4000);

          currentToastIndex = (currentToastIndex + 1) % toasts.length;
        }

        // Start 5 seconds after load
        setTimeout(function() {
          showNextToast();
          // Rotate every 45 seconds
          setInterval(showNextToast, 45000);
        }, 5000);
      }

      // --- STAR RATING & COUNTER DOM INJECTION ---
      function injectSocialProof() {
        // 1. Inject Star Rating under Hero Headline
        var headline = findHeroHeadline();
        if (headline && !document.querySelector('.ts-star-rating')) {
          var rating = document.createElement('div');
          rating.className = 'ts-star-rating';
          rating.innerHTML = 
            '<span class="ts-stars">⭐⭐⭐⭐⭐</span>' +
            '<span class="ts-rating-bold">4.9/5</span>' +
            '<span class="ts-rating-sub">· Loved by tradespeople across Canada 🇨🇦 USA 🇺🇸 and UK 🇬🇧</span>';
          headline.parentNode.insertBefore(rating, headline.nextSibling);
        }

        // 2. Inject Counter under Hero CTA button
        var cta = findHeroCta();
        if (cta && !document.querySelector('.ts-counter-container')) {
          var counter = document.createElement('div');
          counter.className = 'ts-counter-container';
          counter.innerHTML = '<span>✅ Join <span class="ts-counter-green"><span class="ts-counter-number">480</span>+</span> tradespeople across Canada, USA & UK already saving time with TradeScribes</span>';
          
          cta.parentNode.insertBefore(counter, cta.nextSibling);
          initCounterAnimation();
        }

        // 3. Initialize toast notifications system once DOM has mounted
        if (document.getElementById('root').children.length > 0) {
          initToastSystem();
        }
      }

      function findHeroHeadline() {
        var h1s = document.querySelectorAll('h1');
        for (var i = 0; i < h1s.length; i++) {
          var text = h1s[i].textContent.toLowerCase();
          if (text.includes('speak') || text.includes('scribe') || text.includes('write')) {
            return h1s[i];
          }
        }
        return h1s[0] || null;
      }

      function findHeroCta() {
        var allLinks = document.querySelectorAll('a, button');
        for (var i = 0; i < allLinks.length; i++) {
          var el = allLinks[i];
          var text = (el.textContent || '').trim().toLowerCase();
          var rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight * 1.5 && rect.top > 0) {
            if (
              text.includes('start') ||
              text.includes('free trial') ||
              text.includes('try') ||
              text.includes('sign up') ||
              text.includes('get started') ||
              text.includes('book') ||
              text.includes('demo')
            ) {
              var styles = window.getComputedStyle(el);
              var bgColor = styles.backgroundColor;
              if (bgColor !== 'rgba(0, 0, 0, 0)' && bgColor !== 'transparent' && rect.width > 80) {
                return el;
              }
            }
          }
        }
        return null;
      }

      function initCounterAnimation() {
        var counterEl = document.querySelector('.ts-counter-number');
        if (!counterEl) return;
        
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting && !entry.target.classList.contains('counted')) {
              entry.target.classList.add('counted');
              animateCountUp(entry.target, 480, 500, 1500);
            }
          });
        }, { threshold: 0.1 });
        observer.observe(counterEl);
      }

      function animateCountUp(el, start, end, duration) {
        var range = end - start;
        var current = start;
        var stepTime = Math.abs(Math.floor(duration / range));
        var timer = setInterval(function() {
          current += 1;
          el.textContent = current;
          if (current >= end) {
            el.textContent = end;
            clearInterval(timer);
          }
        }, stepTime);
      }

      // --- CHATBOT WIDGET CONTROLLER ---
      var toggleBtn = document.getElementById('ts-chat-toggle');
      var chatWindow = document.getElementById('ts-chat-window');
      var chatCloseBtn = document.getElementById('ts-chat-close-btn');
      var chatBody = document.getElementById('ts-chat-body');
      var chatFooter = document.getElementById('ts-chat-footer');
      var chatInput = document.getElementById('ts-chat-input');
      var chatSend = document.getElementById('ts-chat-send');

      var isChatOpen = false;
      var inConversation = false;

      // Mock Answers logic
      function getAIResponse(userText) {
        var cleanText = userText.toLowerCase().trim();
        
        if (cleanText.includes('free trial') || cleanText.includes('trial') || cleanText.includes('cost money')) {
          return "Yes! TradeScribe offers a <strong>7-day free trial</strong> with absolutely no credit card required to sign up. You can test all features fully!";
        }
        if (cleanText.includes('price') || cleanText.includes('pricing') || cleanText.includes('cost') || cleanText.includes('how much')) {
          return "Our subscription is a standard <strong>$29/month</strong>. However, you can currently use code <strong>LAUNCH30</strong> at checkout to get 30% off your subscription!";
        }
        if (cleanText.includes('voice') || cleanText.includes('speak') || cleanText.includes('recording') || cleanText.includes('how it works')) {
          return "It's super easy! Just tap record and talk naturally about your work details (e.g., jobs completed, parts used, client feedback). Our AI instantly formats your speech into clean invoices, quotes, or emails.";
        }
        if (cleanText.includes('code') || cleanText.includes('coupon') || cleanText.includes('launch30') || cleanText.includes('discount')) {
          return "Use the launch code <strong>LAUNCH30</strong> during checkout to save 30% on your monthly subscription!";
        }
        if (cleanText.includes('contact') || cleanText.includes('support') || cleanText.includes('email') || cleanText.includes('phone')) {
          return "You can get in touch with us at 📧 <strong>hello@tradescribes.com</strong>. We're happy to help!";
        }
        
        return "I can help with that! TradeScribe is built to help contractors save hours on job reporting. Could you clarify if you have questions about our <strong>Pricing</strong>, <strong>Free Trial</strong>, or <strong>Voice features</strong>?";
      }

      function showWelcomeView() {
        inConversation = false;
        chatFooter.style.display = 'none';
        chatBody.innerHTML = `
          <div class="ts-chat-welcome">
            <div class="ts-welcome-msg">
              <strong>Hey there! 👋</strong><br>
              Welcome to TradeScribe support. Ask us anything about our AI platform for trade businesses.
            </div>

            <!-- Quick Contact Card -->
            <div class="ts-quick-contact-card">
              <div class="ts-contact-title">Quick Contact Info</div>
              <div class="ts-contact-item">📧 Email: <a href="mailto:hello@tradescribes.com">hello@tradescribes.com</a></div>
            </div>

            <!-- Options -->
            <button class="ts-chat-option-btn" id="ts-opt-ai">Chat with AI Assistant</button>
            <button class="ts-chat-option-btn" id="ts-opt-pricing">Pricing & Discount Code</button>
            <button class="ts-chat-option-btn" id="ts-opt-trial">Start 7-Day Free Trial</button>
          </div>
        `;

        document.getElementById('ts-opt-ai').onclick = function() { startConversation(); };
        document.getElementById('ts-opt-pricing').onclick = function() { 
          startConversation();
          addMessage("user", "What is the pricing?");
          simulateBotReply("Our monthly subscription is $29/month. Don't forget you can use code **LAUNCH30** for 30% off! Also, we have a 7-day free trial with no credit card required.");
        };
        document.getElementById('ts-opt-trial').onclick = function() {
          startConversation();
          addMessage("user", "How do I start the free trial?");
          simulateBotReply("To start your 7-day free trial, click any 'Start Free Trial' button on our landing page. You won't need to input a credit card to try it out!");
        };
      }

      function startConversation() {
        inConversation = true;
        chatFooter.style.display = 'flex';
        chatBody.innerHTML = `
          <div class="ts-message bot">
            <div class="ts-msg-content">Hello! I am your TradeScribe Assistant. Ask me anything about how we help tradespeople save time reporting.</div>
            <div class="ts-msg-time">${getCurrentTime()}</div>
          </div>
          <div class="ts-typing-indicator" id="ts-typing">
            <div class="ts-typing-dots">
              <span></span><span></span><span></span>
            </div>
          </div>
        `;

        addSuggestions();
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function getCurrentTime() {
        var now = new Date();
        var hrs = now.getHours();
        var mins = now.getMinutes();
        var ampm = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12;
        hrs = hrs ? hrs : 12;
        mins = mins < 10 ? '0'+mins : mins;
        return hrs + ':' + mins + ' ' + ampm;
      }

      function addMessage(sender, text) {
        var existingChips = document.querySelector('.ts-chat-suggestions');
        if (existingChips) existingChips.remove();

        var msg = document.createElement('div');
        msg.className = 'ts-message ' + sender;
        msg.innerHTML = `
          <div class="ts-msg-content">${text}</div>
          <div class="ts-msg-time">${getCurrentTime()}</div>
        `;
        
        var typing = document.getElementById('ts-typing');
        chatBody.insertBefore(msg, typing);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function addSuggestions() {
        var suggestions = document.createElement('div');
        suggestions.className = 'ts-chat-suggestions';
        suggestions.innerHTML = `
          <button class="ts-suggestion-chip">How does it work?</button>
          <button class="ts-suggestion-chip">Is there a free trial?</button>
          <button class="ts-suggestion-chip">Do you have a coupon?</button>
        `;

        chatBody.appendChild(suggestions);

        var chips = suggestions.querySelectorAll('.ts-suggestion-chip');
        chips.forEach(function(chip) {
          chip.onclick = function() {
            var val = chip.textContent;
            addMessage("user", val);
            handleUserMessage(val);
          };
        });
      }

      function simulateBotReply(replyText) {
        var typing = document.getElementById('ts-typing');
        typing.style.display = 'block';
        chatBody.scrollTop = chatBody.scrollHeight;

        setTimeout(function() {
          typing.style.display = 'none';
          addMessage("bot", replyText);
          addSuggestions();
        }, 1000 + Math.random() * 800);
      }

      function handleUserMessage(text) {
        var reply = getAIResponse(text);
        simulateBotReply(reply);
      }

      function sendMessage() {
        var val = chatInput.value.trim();
        if (!val) return;
        chatInput.value = '';
        addMessage("user", val);
        handleUserMessage(val);
      }

      // Event listeners for chat UI
      toggleBtn.onclick = function() {
        isChatOpen = !isChatOpen;
        if (isChatOpen) {
          chatWindow.style.display = 'flex';
          document.getElementById('ts-chat-icon').style.display = 'none';
          document.getElementById('ts-close-icon').style.display = 'block';
          if (!inConversation) {
            showWelcomeView();
          }
        } else {
          chatWindow.style.display = 'none';
          document.getElementById('ts-chat-icon').style.display = 'block';
          document.getElementById('ts-close-icon').style.display = 'none';
        }
      };

      chatCloseBtn.onclick = function() {
        toggleBtn.click();
      };

      chatSend.onclick = sendMessage;
      chatInput.onkeypress = function(e) {
        if (e.key === 'Enter') sendMessage();
      };

      // Set up MutationObserver to react to updates and page rendering
      var observer = new MutationObserver(function() {
        requestAnimationFrame(injectSocialProof);
      });

      var root = document.getElementById('root');
      if (root) {
        observer.observe(root, { childList: true, subtree: true });
      }

      // Run immediately & backup delays
      setTimeout(injectSocialProof, 1000);
      setTimeout(injectSocialProof, 3000);
      setTimeout(injectSocialProof, 5000);

      // --- STICKY MOBILE CTA ---
      var stickyCta = document.createElement('div');
      stickyCta.className = 'ts-sticky-cta';
      stickyCta.innerHTML = '<a href="#" class="ts-sticky-cta-btn" id="ts-mobile-cta">Start 7-Day Free Trial</a>';
      document.body.appendChild(stickyCta);
      
      document.getElementById('ts-mobile-cta').onclick = function(e) {
        e.preventDefault();
        var mainCta = findHeroCta();
        if (mainCta) mainCta.click();
      };

      // --- EXIT INTENT POPUP ---
      var exitOverlay = document.createElement('div');
      exitOverlay.className = 'ts-exit-overlay';
      exitOverlay.innerHTML = `
        <div class="ts-exit-modal">
          <button class="ts-exit-close" id="ts-exit-close">&times;</button>
          <h2>Wait! Don't leave empty-handed.</h2>
          <p>Start your 7-day free trial now and lock in <strong>30% off for life</strong> with code <strong>LAUNCH30</strong>.</p>
          <a href="#" class="ts-sticky-cta-btn" id="ts-exit-cta">Claim My 30% Off & Free Trial</a>
        </div>
      `;
      document.body.appendChild(exitOverlay);

      document.getElementById('ts-exit-close').onclick = function() {
        exitOverlay.style.display = 'none';
      };
      
      document.getElementById('ts-exit-cta').onclick = function(e) {
        e.preventDefault();
        exitOverlay.style.display = 'none';
        var mainCta = findHeroCta();
        if (mainCta) mainCta.click();
      };

      var hasShownExit = false;
      document.addEventListener('mouseout', function(e) {
        if (e.clientY < 50 && !hasShownExit && !localStorage.getItem('ts_exit_shown')) {
          hasShownExit = true;
          localStorage.setItem('ts_exit_shown', 'true');
          exitOverlay.style.display = 'flex';
        }
      });

      // --- FLOATING DEMO VIDEO ---
      if (!localStorage.getItem('ts_demo_closed')) {
        var demoWidget = document.createElement('div');
        demoWidget.className = 'ts-floating-demo';
        demoWidget.innerHTML = `
          <button class="ts-demo-close" id="ts-demo-close">&times;</button>
          <video autoplay loop muted playsinline>
            <source src="WhatsApp%20Video%202026-05-26%20at%209.06.36%20PM.mp4" type="video/mp4">
          </video>
          <div class="ts-demo-label">See it in action</div>
        `;
        document.body.appendChild(demoWidget);

        document.getElementById('ts-demo-close').onclick = function(e) {
          e.stopPropagation();
          demoWidget.style.display = 'none';
          localStorage.setItem('ts_demo_closed', 'true');
        };

        demoWidget.onclick = function() {
          var mainCta = findHeroCta();
          if (mainCta) mainCta.click();
        };
      }
    })();
    </script>
  </body>
</html>
